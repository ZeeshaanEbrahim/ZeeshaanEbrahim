<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" role="img" aria-label="Language stack">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset=".54" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient><radialGradient id="o0"><stop offset="0" stop-color="#58a6ff" stop-opacity="0.72"/><stop offset=".58" stop-color="#58a6ff" stop-opacity=".18"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient><radialGradient id="o1"><stop offset="0" stop-color="#39d353" stop-opacity="0.5"/><stop offset=".58" stop-color="#39d353" stop-opacity=".18"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></radialGradient><radialGradient id="o2"><stop offset="0" stop-color="#a371f7" stop-opacity="0.72"/><stop offset=".58" stop-color="#a371f7" stop-opacity=".18"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient><radialGradient id="o3"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/><stop offset=".58" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient></defs>
<style>
.orb-a{animation:fa 9s ease-in-out infinite}.orb-b{animation:fb 11s ease-in-out infinite 1.1s}.orb-c{animation:fc 13s ease-in-out infinite .6s}
.ring{animation:ring 8s ease-in-out infinite}.ring-b{animation:ring 10s ease-in-out infinite 1.6s}
.chip{animation:chip .65s ease-out both}.cursor{animation:cur 1.1s step-end infinite}
.bar{animation:bar 1.15s ease-out both;transform-box:fill-box;transform-origin:left}
.cell{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes fa{0%,100%{transform:translate(0,0);opacity:.58}50%{transform:translate(28px,-20px);opacity:.86}}
@keyframes fb{0%,100%{transform:translate(0,0);opacity:.42}50%{transform:translate(-24px,18px);opacity:.72}}
@keyframes fc{0%,100%{transform:translate(0,0) scale(1);opacity:.34}50%{transform:translate(18px,-12px) scale(1.18);opacity:.62}}
@keyframes ring{0%,100%{opacity:.06}50%{opacity:.22}}
@keyframes chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.15)}55%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}</style>
